name: Keep Alive

# Render free tier : 750 instance hours / mois pour tout le workspace.
# Un service eveille 24/7 en consomme 744 sur un mois de 31 jours — il ne
# reste que 6 h de marge, et chaque redeploiement en consomme aussi. Garder
# le solveur eveille en permanence est donc structurellement impossible sur
# l'offre gratuite : le ping toutes les 10 min etait la cause de la
# consommation, pas une protection.
#
# On ne le reveille donc qu'aux heures ouvrees. Hors fenetre, Render
# l'endort apres 15 min d'inactivite et il cesse de consommer des heures ;
# le front le reveille a la demande via /api/ping-solver quand quelqu'un
# ouvre l'application (voir components/schedule-app.tsx).
#
# Les crons GitHub sont en UTC. La fenetre 05:00-18:50 UTC couvre
# 7h-20h50 en France l'ete (UTC+2) et 6h-19h50 l'hiver (UTC+1).
on:
  schedule:
    # Solveur Render : lun-ven uniquement, dans la fenetre de travail.
    # ~14 h/jour x 22 jours ouvres = ~315 h/mois (marge : ~435 h).
    - cron: '*/10 5-18 * * 1-5'
    # Supabase : un seul ping par jour suffit (pause a 7 jours d'inactivite),
    # tous les jours pour couvrir les semaines de conges.
    - cron: '17 6 * * *'
  workflow_dispatch:

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
  SUPABASE_URL: https://rmrxsaiianffhpxpntws.supabase.co
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend (Guard API)
        id: backend
        # Uniquement sur le cron de la fenetre de travail (et en manuel).
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 5-18 * * 1-5'
        run: |
          echo "🔄 Pinging backend..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://guard-api-cardiomaine.onrender.com/)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Backend Status: $HTTP_CODE"
          echo "Backend Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Backend ping failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Backend ping successful"
        continue-on-error: true

      - name: Ping Supabase (évite la pause à 7 jours d'inactivité)
        id: supabase
        # Une fois par jour seulement — inutile de le pinguer toutes les 10 min.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        run: |
          echo "🔄 Pinging Supabase..."
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ SUPABASE_ANON_KEY absent (secret GitHub non configuré) - ping ignoré"
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/settings?select=*&limit=1")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Supabase Status: $HTTP_CODE"
          echo "Supabase Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Supabase ping failed with status $HTTP_CODE"
            exit 1
          fi
          echo "✅ Supabase ping successful"
        continue-on-error: true

      - name: Send Slack Notification on Failure
        if: |
          failure() && env.SLACK_WEBHOOK != '' &&
          (steps.backend.outcome == 'failure' || steps.supabase.outcome == 'failure')
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 Keep Alive Workflow Alert",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚨 Service Down*\n*Repository:* planning-cardiomaine\n*Backend:* ${{ steps.backend.outcome }}\n*Supabase:* ${{ steps.supabase.outcome }}\n*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
