name: Keep Alive

on:
  schedule:
    # Toutes les 14 minutes (pour éviter le dormancy Render)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render deployment
        run: |
          curl -f \
            -H "User-Agent: GitHub-Actions-Keep-Alive" \
            https://planning-cardiomaine.onrender.com/api/health || true
        continue-on-error: true

      - name: Ping Guard API backend
        run: |
          curl -f \
            -H "User-Agent: GitHub-Actions-Keep-Alive" \
            https://guard-api-cardiomaine.onrender.com/health || true
        continue-on-error: true
